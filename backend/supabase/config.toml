project_id = "asha-sathi"

[auth]
site_url = "http://localhost:5173"
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Sandbox login for local testing without an SMS provider:
# [auth.sms.test_otp]
# 919876543210 = "123456"

# auth-otp is called before anyone is signed in, so it cannot require a JWT.
# It validates its own input and uses Supabase's built-in OTP rate limits.
[functions.auth-otp]
verify_jwt = false

# These two require a JWT and additionally confirm a real signed-in user in code.
[functions.gnani-stt]
verify_jwt = true

[functions.gnani-tts]
verify_jwt = true
